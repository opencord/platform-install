---

- name: Include vars
  hosts: all
  tasks:
    - name: Include variables
      include_vars: "{{ item }}"
      with_items:
        - "{{ playbook_dir }}/profile_manifests/{{ cord_profile }}.yml"
        - "{{ playbook_dir }}/profile_manifests/local_vars.yml"
  tags:
    - frontend
    - mock-rcord
    - mock-ecord
    - rcord
    - ecord

- name: Add xos onboarded containers to inventory to test
  hosts: head
  roles:
    - xos-onboard-hosts
  tags:
    - frontend
    - mock-rcord
    - mock-ecord
    - rcord
    - ecord

- name: Check UI Container
  hosts: xos-ui
  connection: docker
  roles:
    - xos-container-test-ui
  tags:
    - frontend
    - mock-rcord
    - mock-ecord
    - rcord
    - ecord

