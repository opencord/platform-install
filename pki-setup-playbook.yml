---
# Create a SSL CA for CORD pod use

- name: Include vars
  hosts: localhost
  connection: local
  tasks:
    - name: Include variables
      include_vars: "{{ item }}"
      with_items:
        - "profile_manifests/{{ cord_profile }}.yml"
        - profile_manifests/local_vars.yml

- name: Create SSL Root CA, Intermediate CA, Server certs, SSH CA and keypairs
  hosts: localhost
  connection: local
  roles:
    - pki-root-ca
    - pki-intermediate-ca
    - pki-cert
    - ssh-pki

- name: Install SSL CA certificates on all nodes
  hosts: all
  become: yes
  roles:
    - pki-install

