---
# pki-install/tasks/main.yml

- name: Copy CA certificates to head node
  become: yes
  copy:
    src: "{{ pki_dir }}/{{ item.src }}"
    dest: "/usr/local/share/ca-certificates/{{ item.dest }}"
  with_items:
    - src: "root_ca/certs/ca_cert.pem"
      dest: "cord_root_ca.crt"
    - src: "intermediate_ca/certs/im_cert.pem"
      dest: "cord_intermediate_ca.crt"
  notify:
    - Run update-ca-certificates on head node

- name: Create PKI directory structure
  become: yes
  file:
    path: "{{ item }}"
    state: directory
  with_items:
    - "{{ pki_dir }}"
    - "{{ pki_dir }}/intermediate_ca"
    - "{{ pki_dir }}/intermediate_ca/certs"
    - "{{ pki_dir }}/intermediate_ca/private"

- name: Copy certs needed by XOS
  become: yes
  copy:
    src: "{{ pki_dir }}/{{ item }}"
    dest: "{{ pki_dir }}/{{ item }}"
  with_items:
    - "intermediate_ca/certs/im_cert_chain.pem"
    - "intermediate_ca/private/xos-core.{{ site_suffix }}_key.pem"
    - "intermediate_ca/certs/xos-core.{{ site_suffix }}_cert_chain.pem"

- name: Copy certs needed by OpenStack
  become: yes
  when: use_openstack
  copy:
    src: "{{ pki_dir }}/{{ item }}"
    dest: "{{ pki_dir }}/{{ item }}"
  with_items:
    - "intermediate_ca/private/keystone.{{ site_suffix }}_key.pem"
    - "intermediate_ca/certs/keystone.{{ site_suffix }}_cert.pem"

