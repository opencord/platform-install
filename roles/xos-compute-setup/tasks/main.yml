---
# xos-compute-setup/tasks/main.yml
#
# Tell XOS that a new compute node has been added

- name: Create nodes/vtn config
  template:
    src: "{{ item }}.j2"
    dest: "{{ service_profile_repo_dest }}/{{ xos_configuration }}/{{ item }}"
    owner: "{{ ansible_user_id }}"
    mode: 0644
  with_items:
    - vtn.yaml
    - nodes.yaml

- name: Run 'make vtn' for this configuration
  command: chdir="{{ service_profile_repo_dest }}/{{ xos_configuration }}" bash -c "make vtn |& tee xos-make-compute-setup.out"
  tags:
    - skip_ansible_lint

