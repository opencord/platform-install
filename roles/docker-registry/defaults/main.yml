# docker-registry/defaults/main.yml

pki_dir: "{{ playbook_dir }}/pki"
credentials_dir: "{{ playbook_dir }}/credentials"

xos_admin_user: "xosadmin@opencord.org"
xos_admin_pass: "{{ lookup('password', credentials_dir ~ '/' ~ xos_admin_user ~ ' chars=ascii_letters,digits') }}"

# docker registry settings
docker_registry_image: "registry:2"
docker_registry_ext_port: "5000"
docker_registry_htpaswd_realm: "CORD Registry"
docker_registry_http_secret: "{{ lookup('password', credentials_dir ~ '/docker_registry_http_secret chars=ascii_letters,digits,length=32') }}"
# see https://docs.docker.com/registry/recipes/mirror/
docker_registry_proxy_remoteurl: "https://registry-1.docker.io"

# list of docker registry users
docker_registry_users:
  - name: "{{ xos_admin_user }}"
    password: "{{ xos_admin_pass }}"


