---
# docker-registry/tasks/main.yml

- name: Create docker registry directories
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: docker
    mode: 0750
  with_items:
    - /etc/docker/registry
    - /etc/docker/registry/auth
    - /etc/docker/registry/certs

- name: Create user accounts for docker registry
  htpasswd:
    path: /etc/docker/registry/auth/htpasswd
    create: yes
    name: "{{ item.name }}"
    password: "{{ item.password }}"
    owner: root
    group: docker
    mode: 0640
  with_items: "{{ docker_registry_users }}"

- name: Copy over SSL keys for the registry
  copy:
    src: "{{ item.src }}"
    dest:  "/etc/docker/registry/certs/{{ item.dest }}"
    mode: "{{ item.mode }}"
    owner: root
    group: docker
  with_items:
    - src: "{{ pki_dir }}/root_ca/certs/ca_cert.pem"
      dest: "ca_cert.pem"
      mode: "0444"
    - src: "{{ pki_dir }}/{{ site_name }}_im_ca/certs/registry.{{ site_suffix }}_cert_chain.pem"
      dest: "docker_registry.pem"
      mode: "0444"
    - src: "{{ pki_dir }}/{{ site_name }}_im_ca/private/registry.{{ site_suffix }}_key.pem"
      dest: "docker_registry_key.pem"
      mode: "0440"

- name: Pull the docker registry image
  docker_image:
    name: "{{ docker_registry_image }}"

- name: Create docker-compose file for running the registry
  template:
    src: docker-compose.yml.j2
    dest: /etc/docker/registry/docker-compose.yml
    owner: root
    group: docker
    mode: 0640

- name: Start the docker registry
  docker_service:
    project_name: "cordreg"
    project_src: "/etc/docker/registry/"

