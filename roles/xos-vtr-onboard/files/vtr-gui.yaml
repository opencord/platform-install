   - custom_types/xos.yaml

topology_template:
  node_templates:

    # UI Extension
    vtr:
      type: tosca.nodes.XOSGuiExtension
      properties:
        files: /spa/extensions/vtr/vendor.js, /spa/extensions/vtr/app.js