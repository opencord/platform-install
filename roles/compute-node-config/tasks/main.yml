---
# compute-node-config/tasks/main.yml
#
# Build TOSCA to tell XOS that a new OpenStack compute node has been added

- name: Create nodes.yaml TOSCA config
  template:
    src: "{{ item }}"
    dest: "{{ cord_profile_dir }}/nodes.yaml"
    owner: "{{ ansible_user_id }}"
    mode: 0644
  with_items:
    - openstack-compute.yaml.j2
    - openstack-compute-vtn.yaml.j2

