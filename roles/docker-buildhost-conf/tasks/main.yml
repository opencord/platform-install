---
# docker-buildhost-conf/tasks/main.yml

- name: Prereqs and SSL support for apt for SSL
  become: yes
  apt:
    name: "{{ item }}"
    update_cache: yes
    cache_valid_time: 3600
  with_items:
    - apt-transport-https
    - ca-certificates
    - python-pip

- name: Trust docker apt key
  become: yes
  apt_key:
    data: "{{ lookup('file', 'docker_apt_key.gpg') }}"

- name: Add docker apt repo
  become: yes
  apt_repository:
    repo: "{{ docker_apt_repo }}"

- name: Install docker
  become: yes
  apt:
    name: docker-engine
    update_cache: yes
    cache_valid_time: 3600

# docker fails without docker-py, docker-compose >1.9 fails with docker-py installed
- name: Install docker-compose and docker-py
  become: yes
  pip:
    name: "{{ item }}"
  with_items:
    - docker-py
    - docker-compose==1.9

- name: Make current user part of the Docker group
  become: yes
  user:
    name: "{{ ansible_user_id }}"
    groups: "docker"
    append: yes

- name: Copy over docker buildhost client SSL keys
  copy:
    src: "{{ item.src }}"
    dest:  "{{ ansible_user_dir }}/.docker/{{ item.dest }}"
    mode: "{{ item.mode }}"
    owner:  "{{ ansible_user_id }}"
  with_items:
    - src: "{{ pki_dir }}/root_ca/certs/ca_cert.pem"
      dest: "ca.pem"
      mode: "0444"
    - src: "{{ pki_dir }}/intermediate_ca/certs/dockerbuildhost_cert_chain.pem"
      dest: "cert.pem"
      mode: "0444"
    - src: "{{ pki_dir }}/intermediate_ca/private/dockerbuildhost_key.pem"
      dest: "key.pem"
      mode: "0400"

- name: Create ~/.docker/config.json file
  template:
    src: config.json.j2
    dest: "{{ ansible_user_dir }}/.docker/config.json"
    owner:  "{{ ansible_user_id }}"
    mode: 0444

- name: Configure docker CLI tool to verify TLS and use docker host
  lineinfile:
    dest: "{{ ansible_user_dir }}/.profile"
    regexp: "^export DOCKER_TLS_VERIFY"
    line: "export DOCKER_TLS_VERIFY=1 DOCKER_HOST=tcp://{{ hostvars[headnode_name].ansible_default_ipv4.address }}:2376"
    create: yes
    insertafter: EOF

