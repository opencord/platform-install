---
# teardown-nova/tasks/main.yml
# Destroys the currently created nova instances
# NOTE: ignoring errors so that incomplete builds can be removed

- name: Check if nova is installed
  shell: which nova
  register: nova_output
  tags:
     - skip_ansible_lint # running a sub job

- name: Find nova instances after purging XOS database
  shell: source /opt/cord_profile/admin-openrc.sh; nova list --all-tenants | grep -i my | awk '{print $2}' | grep -v ^ID | grep -v ^$ | xargs -n1 echo
  register: output
  when: nova_output.stdout != ""
  ignore_errors: yes
  tags:
     - skip_ansible_lint # running a sub job

- name: Delete Nova instances
  shell: source /opt/cord_profile/admin-openrc.sh; nova list --all-tenants | grep -i my | awk '{print $2}' | grep -v ^ID | grep -v ^$ | xargs -n1 nova delete
  when: nova_output.stdout != "" and output.stdout != ""
  tags:
     - skip_ansible_lint # running a sub job

- name: Waiting for Nova instances to be deleted
  shell: source /opt/cord_profile/admin-openrc.sh; nova list --all-tenants | grep -i my | awk '{print $2}' | grep -v ^ID | grep -v ^$ | xargs -n1 echo
  register: task_result
  until: task_result.stdout== ""
  retries: 20
  delay: 10
  tags:
     - skip_ansible_lint # running a sub job

