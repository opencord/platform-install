# Run the containers
- name: Run gui-extensions containers
  docker_container:
    name: "gui-extensions-{{ item.name }}"
    image: "xosproject/gui-extension-{{ item.name }}"
    volumes:
      - "{{ cord_dir }}/{{ item.path }}/"
    command: npm run build
    volumes_from:
      - gui-extensions-store
  with_items: "{{ enabled_gui_extensions }}"

# Compile the TOSCA to persist extensions
- name: Create templated TOSCA to persist extensions
  template:
    src: "{{ item }}.j2"
    dest: "{{ cord_profile_dir }}/{{ item }}"
    mode: 0644
  with_items:
    - xos-gui-extensions.yml
