# cord-helm-images/tasks/main.yml

# duplicate of what is in cord-helm-values role, but either might be used standalone
- name: Create cord_values directory
  file:
    dest: "{{ config_cord_values_dir }}"
    state: directory
    mode: 0755
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"

- name: Collect list of images into helm_images list
  set_fact:
    helm_images: |
      {{ ib_built | union(ib_pulled) | union(ib_preexisting_images) }}

- name: Create cord_images.yaml from ib_actions.yaml
  template:
    src: "cord_images.yaml.j2"
    dest: "{{ config_cord_values_dir }}/cord_images.yaml.j2"

