---

# If using a MAAS based POD deployment then copy over an apache configuration
# that forwards to the various UIs
- name: Ensure CORD Apache Configuration
  become: yes
  copy:
    src: files/cord-http.conf
    dest: /etc/apache2/conf-available/cord-http.conf
    owner: root
    group: root
    mode: 0644
  when: on_maas

- name: Enable CORD Apache Configuration
  become: yes
  file:
    src: /etc/apache2/conf-available/cord-http.conf
    path: /etc/apache2/conf-enabled/cord-http.conf
    owner: root
    group: root
    mode: 0644
    state: link
  when: on_maas

- name: Reload Apache Configuration
  become: yes
  service:
    name: apache2
    state: reloaded
  when: on_maas
