---
# onos-debug/tasks/main.yml

- name: Wait for onos-cord container to be accessible via SSH
  wait_for:
    host: onos-cord
    port: "{{ onos_cord_port }}"
    search_regex: "OpenSSH"
    delay: 15
    timeout: 180

- name: Enable ONOS debugging for specific apps
  shell: "sshpass -p 'karaf' ssh -p {{ onos_cord_port }} karaf@onos-cord set log {{ onos_debug_level }} {{ item }}"
  ignore_errors: yes
  with_items: "{{ onos_debug_appnames }}"
  tags:
    - skip_ansible_lint # collecting docker container names

