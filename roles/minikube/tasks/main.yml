# minikube/tasks/main.yml
# Installs minikube for kubernetes

- name: Download minikube debian package
  become: yes
  get_url:
    url: "{{ minikube_dl_url }}"
    checksum: "{{ minikube_dl_checksum }}"
    dest: "/tmp/minikube.deb"

- name: Install minikube debian package
  become: yes
  apt:
    deb: "/tmp/minikube.deb"

- name: Install socat (for port forwarding)
  become: yes
  apt:
    name: socat
    update_cache: yes
    cache_valid_time: 3600

