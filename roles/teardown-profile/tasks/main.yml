---
# teardown-profile/tasks/main.yml
# Destroys the currently created profile
# NOTE: ignoring errors so that incomplete builds can be removed

- name: Stop and remove XOS containers
  docker_service:
    project_name: "{{ cord_profile | regex_replace('\\W','') }}"
    project_src: "{{ cord_profile_dir }}"
    state: absent
    remove_images: local
  ignore_errors: yes

# need to remove images using docker_images here?

- name: Remove docker networks
  docker_network:
    name: "{{ item }}"
    state: absent
  with_items: "{{ xos_docker_networks }}"
  ignore_errors: yes

- name: Remove the cord_profile directory
  file:
    path: "{{ cord_profile_dir }}"
    state: absent
  ignore_errors: yes
  when: delete_cord_profile_dir

- name: Check if nova is installed
  shell: which nova
  register: nova_output
  tags: nova_out

- name: Find nova instances after purging XOS database
  shell: source /opt/cord_profile/admin-openrc.sh; nova list --all-tenants | grep -i my | awk '{print $2}' | grep -v ^ID | grep -v ^$ | xargs -n1 echo
  register: output
  tags: register
  when: nova_output.stdout != ""
  ignore_errors: yes

- name: Delete Nova instances
  shell: source /opt/cord_profile/admin-openrc.sh; nova list --all-tenants | grep -i my | awk '{print $2}' | grep -v ^ID | grep -v ^$ | xargs -n1 nova delete
  when: nova_output.stdout != "" and output.stdout != ""
