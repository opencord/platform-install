---
# cord-profile/tasks/main.yml
# Constructs a CORD service profile directory and configuration files

- name: Create cord_profile directory
  file:
    path: "{{ cord_dir }}/{{ cord_profile }}"
    state: directory
    mode: 0755

- name: Create subdirectories inside cord_profile directory
  file:
    path: "{{ cord_dir }}/{{ cord_profile }}/{{ item }}"
    state: directory
    mode: 0755
  with_items:
    - key_import
    - onboarding-docker-compose
    - images

- name: Copy ssh keys to key_import directory
  copy:
    remote_src: True # file is local to the remote machine
    src: "{{ item.source_path | expanduser }}"
    dest: "{{ cord_dir }}/{{ cord_profile }}/key_import/{{ item.name }}"
    mode: 0600
  with_items: "{{ xos_service_sshkeys }}"

- name: Create xos-bootstrap-docker-compose.yaml file
  template:
    src: "xos-bootstrap-docker-compose.yaml.j2"
    dest: "{{ cord_dir }}/{{ cord_profile }}/xos-bootstrap-docker-compose.yaml"
    mode: 0644

- name: Create templated xos_common_config file
  template:
    src: "xos_common_config.j2"
    dest: "{{ cord_dir }}/{{ cord_profile }}/xos_common_config"
    mode: 0644

- name: Create templated profile specific xos.yaml file
  template:
    src: "{{ cord_profile }}-xos.yaml.j2"
    dest: "{{ cord_dir }}/{{ cord_profile }}/xos.yaml"

- name: Copy over commonly used and utility TOSCA files
  copy:
    src: "{{ item }}"
    dest: "{{ cord_dir }}/{{ cord_profile }}/{{ item }}"
  with_items:
    - "fixtures.yaml"
    - "enable-onboarding.yaml"
    - "disable-onboarding.yaml"

- name: Create templated TOSCA config files
  template:
    src: "{{ item }}.j2"
    dest: "{{ cord_dir }}/{{ cord_profile }}/{{ item }}"
  with_items: "{{ xos_tosca_templates }}"

- name: Copy library onboarding TOSCA files
  copy:
    src: "{{ cord_dir }}/orchestration/xos_libraries/{{ item }}/{{ item }}-onboard.yaml"
    dest: "{{ cord_dir }}/{{ cord_profile }}/{{ item }}-onboard.yaml"
  with_items: "{{ xos_libraries }}"

- name: Copy service onboarding TOSCA files
  copy:
    src: "{{ cord_dir }}/{{ item.path }}/xos/{{ item.name }}-onboard.yaml"
    dest: "{{ cord_dir }}/{{ cord_profile }}/{{ item.name }}-onboard.yaml"
  with_items: "{{ xos_services }}"

