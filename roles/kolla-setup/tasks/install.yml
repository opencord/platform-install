---
- name: Run update apt packages
  apt:
    update_cache: yes

- name: Install ubuntu dependencies
  apt:
    name: {{ item }}
    state: present
  with_items:
    - python-pip
    - python-dev
    - libffi-dev
    - gcc
    - libssl-dev
    - python-selinux
 
- name: Upgrade pip and ansible to the latest version
  apt:
    name: pip
    state: latest
  with_items:
    - ansible
    - pip

- name: Install kolla-ansible
  pip:
    name: kolla-ansible
    version: 5.0.1

- name: Copy globals.yml and passwords.yml to /etc/kolla directory
  copy:
    src: /usr/share/kolla-ansible/etc_examples/kolla
    dest: /etc/kolla/


- name: Create cinder-volumes 
  script: {{ role_path }}/files/set-cinder.sh


- name: Setting passwords
  shell: kolla-genpwd

- name: Copy globals.yml to /etc/kolla directory
  copy: {{ role_path }}/templates/globals.yml.j2
  dest: /etc/kolla/globals.yml

- name: Bootstrap servers with kolla deploy dependencie
  shell: kolla-ansible -i ./multinode bootstrap-servers

- name: Pre-deployment checks for hosts
  shell: kolla-ansible -i ./multinode prechecks

- name: OpenStack deployment
  shell: kolla-ansible -i ./multinode deploy


