# helm/tasks/main.yml
# Installs Helm for kubernetes

- name: Download and install Helm tool
  become: yes
  get_url:
    url: "{{ helm_dl_url }}"
    checksum: "{{ helm_checksum }}"
    dest: "/usr/local/bin/helm"
    owner: root
    group: root
    mode: 0755

