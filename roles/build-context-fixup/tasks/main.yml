---
# build-context-fixup/tasks/main.yml

- name: Sync chameleon.tmp directories with chameleon repo
  synchronize:
    src: "{{ build_cord_dir }}/component/chameleon/"
    dest: "{{ item }}"
    delete: yes
    rsync_opts:
      - "--exclude=.git"
  delegate_to: "{{ groups['build'] | first }}"
  with_items:
    - "{{ build_cord_dir }}/orchestration/xos/containers/chameleon/tmp.chameleon/"
    - "{{ build_cord_dir }}/orchestration/xos/containers/xos/tmp.chameleon/"

