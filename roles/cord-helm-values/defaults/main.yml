# cord-helm-values/defaults/main.yml

config_cord_values_dir: "{{ ( playbook_dir ~ '/../../../cord_values' ) | realpath }}"

pki_dir: "{{ playbook_dir }}/pki"
ssh_pki_dir: "{{ playbook_dir }}/ssh_pki"
credentials_dir: "{{ playbook_dir }}/credentials"

# site name
site_name: placeholder-sitename
site_humanname: "Placeholder Site HumanName"
site_suffix: "{{ site_name }}.test"

# Docker related settings
docker_registry_ext_port: "5000"
docker_registry: "docker-registry.{{ site_suffix }}:{{ docker_registry_ext_port }}"

docker_tag: "candidate"

# XOS related settings
xos_admin_user: "xosadmin@opencord.org"
xos_admin_pass: "{{ lookup('password', credentials_dir ~ '/' ~ xos_admin_user ~ ' chars=ascii_letters,digits') }}"
xos_admin_first: XOS
xos_admin_last: Admin

# list of XOS services with charts to work around helm's scoping issues with
# dependencies:
#  https://docs.helm.sh/developing_charts/#scope-dependencies-and-values

helm_xos_services:
  - "addressmanager"
  - "exampleservice"
  - "fabric"
  - "onos-service"
  - "openstack"
  - "volt"
  - "vrouter"
  - "vsg-hw"
  - "vtn-service"

