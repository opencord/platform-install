#xos-postgres tests

- name: Check PSQL Service Status
  service:
    name: postgresql
    state: started
  tags:
    - skip_ansible_lint # running a sub job

- name: Check PSQL Service Version/Port
  shell: service postgresql status | grep "{{ item }}"
  register: result
  with_items:
    - 9.6/main
    - port 5432
    - online
  tags:
    - skip_ansible_lint # running a sub job
