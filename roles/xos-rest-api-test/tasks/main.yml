- name: Replace SERVER_IP in API Properties
  replace:
    dest: "{{ cord_test_dir }}/Properties/RestApiProperties.py"
    regexp: "SERVER_IP = '.+'$"
    replace: "SERVER_IP = '{{ api_test_server_ip }}'"
    backup: yes
  tags:
    - frontend
    - mock-rcord
    - mock-ecord
    - rcord
    - ecord

- name: Replace SERVER_PORT in API Properties
  replace:
    dest: "{{ cord_test_dir }}/Properties/RestApiProperties.py"
    regexp: "SERVER_PORT = '.+'$"
    replace: "SERVER_PORT = '{{ api_test_server_port }}'"
  tags:
    - frontend
    - mock-rcord
    - mock-ecord
    - rcord
    - ecord


- name: Replace USER in API Properties
  replace:
    dest: "{{ cord_test_dir }}/Properties/RestApiProperties.py"
    regexp: "USER = '.+'$"
    replace: "USER = '{{ xos_admin_user }}'"
  tags:
    - frontend
    - mock-rcord
    - mock-ecord
    - rcord
    - ecord

- name: Replace PASSWD in API Properties
  replace:
    dest: "{{ cord_test_dir }}/Properties/RestApiProperties.py"
    regexp: "PASSWD = '.+'$"
    replace: "PASSWD = '{{ xos_admin_pass }}'"
  tags:
    - frontend
    - mock-rcord
    - mock-ecord
    - rcord
    - ecord

- name: Install python libraries
  pip: name="{{ api_test_python_packages | join(' ') }}"
  tags:
    - frontend
    - mock-rcord
    - mock-ecord
    - rcord
    - ecord
  become: true


- name: Run Core Tests
  shell: pybot -d Log -T {{ item }};
  args:
    chdir: "{{ cord_test_dir }}/Tests"
  with_items:
    - Ch_DeploymentTest.txt
    - Ch_NodeTest.txt
    - Ch_SanityFlavors.txt
    - Ch_ServiceTest.txt
    - Ch_SiteTest.txt
    - Ch_UsersTest.txt
  tags:
    - skip_ansible_lint # running a sub job
    - frontend
    - mock-rcord
    - mock-ecord
    - rcord
    - ecord

- name: Run R-CORD Tests
  shell: pybot -d Log -T {{ item }};
  args:
    chdir: "{{ cord_test_dir }}/Tests"
  with_items:
    - Ch_SanityInstance.txt
    - Ch_SubscriberTest.txt
  tags:
    - skip_ansible_lint # running a sub job
    - mock-rcord
    - mock-ecord
    - rcord
    - ecord
