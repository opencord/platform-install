---
# xos-start/tasks/main.yml

- name: Build XOS containers
  command: chdir="{{ service_profile_repo_dest }}/{{ xos_configuration }}" make local_containers
  tags:
    - skip_ansible_lint

- name: Onboard services and start XOS
  command: chdir="{{ service_profile_repo_dest }}/{{ xos_configuration }}" make xos
  tags:
    - skip_ansible_lint

- name: Pause to let XOS initialize
  pause: seconds=120

- name: Initial VTN configuration
  command: chdir="{{ service_profile_repo_dest }}/{{ xos_configuration }}" make vtn
  tags:
    - skip_ansible_lint

- name: Initial fabric configuration
  command: chdir="cd {{ service_profile_repo_dest }}/{{ xos_configuration }}" make fabric"
  tags:
    - skip_ansible_lint

- name: Pause to let ONOS initialize
  pause: seconds=20
  tags:
    - skip_ansible_lint

- name: Configure CORD services
  command: chdir="service_profile_repo_dest }}/{{ xos_configuration }}" make cord
  tags:
    - skip_ansible_lint

