---
- name: Install software
  apt:
    name={{ item }}
    update_cache=yes
    cache_valid_time=3600
  become: yes
  register: result
  until: result | success
  retries: 15
  delay: 60
  with_items:
   - lxc

- name: set lxc bridge interface
  become: yes
  lineinfile:
    dest: /etc/lxc/default.conf
    regexp: "^lxc.network.link ="
    line: "lxc.network.link = {{ fabric_bridge_on_head_node }}"

