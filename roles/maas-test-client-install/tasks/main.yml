---
- name: get "fabric" bridge interface
  shell: route -n | grep 10.6.1.0 | awk '{print $8}'
  register: bridge
  tags:
     - skip_ansible_lint # running a sub job

- name: Create testclient LXD profile
  lxd_profile:
    name: testclient
    state: present
    config:
      user.user-data: |
        #cloud-config
        ssh_authorized_keys:
          - "{{ lookup('file', '/tmp/id_rsa.pub') }}"
    description: 'Subscriber test client'
    devices:
      eth0:
        nictype: bridged
        parent: "{{ bridge.stdout }}"
        type: nic

- name: Create testclient container
  lxd_container:
    name: testclient
    architecture: x86_64
    state: started
    source:
      type: image
      mode: pull
      server: https://cloud-images.ubuntu.com/releases
      protocol: simplestreams
      alias: "{{ ansible_distribution_release }}"
    profiles: ["testclient"]
    wait_for_ipv4_addresses: true
    timeout: 600
  notify:
    - set up container networking
