---
- name: Install software
  apt:
    name={{ item }}
    update_cache=yes
    cache_valid_time=3600
  become: yes
  register: result
  until: result | success
  retries: 15
  delay: 60
  with_items:
   - lxc

- name: Remove default LXC bridge
  become: yes
  lineinfile:
    dest: /etc/lxc/default.conf
    regexp: "^lxc.network.link ="
    state: absent

- name: OVS startup script
  become: yes
  copy:
    src: files/ovsup
    dest: /etc/lxc/ovsup
    mode: 0755

- name: Add OVS network start script for LXC
  become: yes
  lineinfile:
    dest: /etc/lxc/default.conf
    line: "lxc.network.script.up = /etc/lxc/ovsup"
    state: present

- name: Create testclient
  become: yes
  shell: lxc-ls | grep testclient || lxc-create -t ubuntu -n testclient
  tags:
    - skip_ansible_lint # FIXME: should used lxc_container module

