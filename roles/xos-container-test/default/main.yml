---
## container test variables

#core components
onboarding_sync: xos_synchronizer_onboarding_1
onboarding_sync_process: python onboarding-synchronizer.py -C /opt/xos/synchronizers/onboarding/onboarding_synchronizer_config
gui: xos-spa-gui_1
gui_process: nginx -g daemon off;
xos_core: xos_core_1
xos_core_process: bash -c cd coreapi; bash ./start_coreapi.sh
chameleon: xos_chameleon_1
chameleon_process: python chameleon/chameleon/main.py -R 9101 -G xos-core:50055
restgw: xos-rest-gw
restgw_process: node src/server.js --config gateway-config.yml
postgres: xos_db_1

#synchronizer components
vsg_sync: xos_synchronizer_vsg_1
