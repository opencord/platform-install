vrouter_sync_process: python vrouter-synchronizer.py -C /opt/xos/synchronizers/vrouter/vrouter_config
vnod_sync: xos_synchronizer_vnod_1
vnod_sync_process: python vnod-synchronizer.py -C /opt/xos/synchronizers/vnod/vnod_config
vtn_sync: xos_synchronizer_vtn_1
