- name: Get Postgres Container ID
  shell: docker ps | grep "{{ postgres }}" | awk '{print $1}'
  register: psql_id
  tags:
    - core

- name: Check Postgres Service
  shell: docker exec {{ psql_id.stdout }} service postgresql status
  register: result
  until: result | success
  retries: 20
  delay: 5
  tags:
    - core

- name: Validate Postgres Service
  assert:
    that:
      - "'9.3/main' in result.stdout"
      - "'port 5432' in result.stdout"
      - "'online' in result.stdout"
  tags:
    - core

