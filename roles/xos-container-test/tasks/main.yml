---

# sanity check of xos-containers

- name: Include vars
  include_vars: "{{ item }}"
  with_items:
    - "/home/vagrant/cord/build/platform-install/profile_manifests/{{ cord_profile }}.yml"
    - /home/vagrant/cord/build/platform-install/profile_manifests/local_vars.yml
  tags:
    - core
    - ecord
    - rcord

- name: Get XOS Core Container ID
  shell: docker ps | grep "{{ xos_core }}" | awk '{print $1}'
  register: xos_core_id
  tags:
    - core

- name: Check XOS Core Process
  shell: docker exec {{ xos_core_id.stdout }} ps -f | grep bash
  register: result
  until: result | success
  retries: 20
  delay: 5
  tags:
    - core

- name: Validate XOS Core Process
  assert:
    that: "'{{ xos_core_process }}' in result.stdout"
  tags:
    - core

- name: Get Volume Mounts on XOS Core
  shell: docker exec {{ xos_core_id.stdout }} mount | grep xos
  register: volumes
  tags:
    - core

- name: Validate Volume Mounts on XOS Core
  assert:
    that: "'/opt/xos_services/{{ item.name }}' in volumes.stdout|lower"
  with_items: "{{ xos_services }}"
  when: 
    - "'{{ item.name }}' != 'vnodlocal'"
    - "'{{ item.name }}' != 'volt'"
  tags:
    - core

