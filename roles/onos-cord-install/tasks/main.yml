---
# onos-cord-install/tasks/main.yml

- name: Pull base docker image for ONOS
  docker_image:
    name: "{{ onos_docker_image }}"

- name: Create dest directory
  file:
    path: "{{ onos_cord_dest }}"
    state: directory

- name: Copy over SSH key
  copy:
    src: "{{ ssh_pki_dir }}/client_certs/headnode_sshkey"
    dest: "{{ onos_cord_dest }}/node_key"
    owner: "{{ ansible_user_id }}"
    mode: 0600

- name: Create templated ONOS files
  template:
    src: "{{ item }}.j2"
    dest: "{{ onos_cord_dest }}/{{ item }}"
  with_items:
    - Dockerfile
    - onos-service
    - org.ops4j.pax.logging.cfg

- name: Copy over ONOS playbook and other files
  copy:
    src: "onos-cord-docker-compose.yml"
    dest: "{{ onos_cord_dest }}/docker-compose.yml"

- name: Copy SSL Certs to ONOS so docker-compose can find it
  copy:
    src: "{{ pki_dir }}/{{ item.src }}"
    dest: "{{ onos_cord_dest }}/{{ item.dest }}"
    owner: "{{ ansible_user_id }}"
  with_items:
    - src: "root_ca/certs/ca_cert.pem"
      dest: "cord_root_ca.crt"
    - src: "intermediate_ca/certs/im_cert.pem"
      dest: "cord_intermediate_ca.crt"

- name: Build xos/onos docker image
  docker_image:
    name: "xos/onos"
    path: "{{ onos_cord_dest }}"
    dockerfile: "Dockerfile"

# environment set here is a hack because the version of docker-compose
# installed (1.9 at this juncture) and/or openssl fails to handle TLS auth
# properly
- name: Start ONOS
  docker_service:
    project_src: "{{ onos_cord_dest }}"
  environment:
    DOCKER_HOST: ""
    DOCKER_TLS_VERIFY: ""

