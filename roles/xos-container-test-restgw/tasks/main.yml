#xos-rest-gw tests

- name: Check Rest GW Process
  shell: ps -f | grep "node src/server.js --config gateway-config.yml"
  register: result
  until: result | success
  retries: 10
  delay: 5
  tags:
    - skip_ansible_lint # running a sub job

- name: Get Volume Mounts on Rest GW Container
  shell: mount -l #| grep xos_services
  register: volumes

- name: Validate Volume Mounts on Rest GW Container
  assert:
    that: "'/opt/xos_services/{{ item.name }}' not in volumes.stdout|lower"
  with_items: "{{ xos_services }}"
  when:
    - "'{{ item.name }}' != 'vnodlocal'"
    - "'{{ item.name }}' != 'volt'"
