#xos-spa-gui tests

- name: Check Rest GW Process
  command: ps -f
  register: result

- name: Validate Rest GW Process
  assert:
    that: "'node src/server.js --config gateway-config.yml' in result.stdout"

- name: Get Volume Mounts on Rest GW Container
  command: mount -l
  register: volumes

- name: Validate Volume Mounts on Rest GW Container
  assert:
    that: "'/opt/xos_services/{{ item.name }}' in volumes.stdout|lower"
  with_items: "{{ xos_services }}"
  when:
    - "'{{ item.name }}' != 'vnodlocal'"
    - "'{{ item.name }}' != 'volt'"