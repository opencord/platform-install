---
# copy-cord/tasks/main.yml

- name: Copy (sync) the CORD directory structure to the head node
  synchronize:
    src: "../.."
    dest: "{{ cord_dir }}"

- name: Set ownership on CORD dir on head node
  file:
    dest: "{{ cord_dir }}"
    state: directory
    recurse: yes
    owner: "{{ ansible_user_id }}"

