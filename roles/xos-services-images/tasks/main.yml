# NOTE we are building a single standalone image at a time here,
# so imagebuilder is not needed, we can get away with docker

- name: Build, Tag and Push docker images for dynamic services
  docker_image:
    name: "xosproject/{{ item.name }}-synchronizer"
    path: "{{ build_cord_dir }}/{{ item.path }}/xos/synchronizer/Dockerfile.synchronizer"
    repository: "{{ pull_docker_registry }}xosproject/{{ item.name }}-synchronizer"
    tag: "{{ pull_docker_tag }}"
    push: yes
  with_items: "{{ xos_dynamic_services }}"