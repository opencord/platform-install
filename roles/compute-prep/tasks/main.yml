---
# file: compute-prep/tasks/main.yml

- name: Install packages
  apt:
    name: "{{ item }}"
    update_cache: yes
    cache_valid_time: 3600
  with_items:
    - python-yaml

- name: Add ubuntu user
  user:
    name: ubuntu
    groups: adm

- name: Add head node key to user accounts
  authorized_key:
    user: "{{ item }}"
    key: "{{ lookup('file', '{{ ssh_pki_dir }}/client_certs/{{ pod_sshkey_name }}_sshkey.pub') }}"
  with_items:
    - root
    - ubuntu

- name: Create /var/lib/nova dir
  file:
    path: /var/lib/nova
    state: directory

