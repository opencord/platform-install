---
# file: compute-prep/tasks/main.yml

- name: Install packages
  apt:
    name: "{{ item }}"
    update_cache: yes
    cache_valid_time: 3600
  with_items:
    - python-yaml

- name: Add ubuntu user
  user:
    name: ubuntu
    groups: adm

- name: Add head node ubuntu user key
  authorized_key:
    user: ubuntu
    key: "{{ lookup('file', '{{ ssh_pki_dir }}/client_certs/headnode_ssh.pub') }}"

- name: Add head node root user key
  authorized_key:
    user: root
    key: "{{ lookup('file', '{{ ssh_pki_dir }}/client_certs/headnode_sshkey.pub') }}"

- name: Create /var/lib/nova dir
  file:
    path: /var/lib/nova
    state: directory

