---
# prep-headnode-playbook.yml
# Preps the head node of a CORD pod for thr est of the install

- name: Include vars
  hosts: head, config
  tasks:
    - name: Include variables
      include_vars: "{{ item }}"
      with_items:
        - "profile_manifests/{{ cord_profile }}.yml"
        - profile_manifests/local_vars.yml

- name: Prep head node, copy cord_profile
  hosts: head
  roles:
    - { role: head-prep, become: yes }
    - { role: copy-profile, become: yes }

- name: Install certificates
  become: yes
  hosts: head
  roles:
    - pki-install

- name: Install docker and configure it
  hosts: head
  roles:
    - docker-install

- name: Configure management network on all nodes
  hosts: all
  become: yes
  roles:
    - interface-config

- name: Networking and DNS server on head node
  hosts: head
  become: yes
  roles:
    - head-mgmtbr
    - dns-unbound
    - dns-nsd

# needs to be in another set of plays so that nsd/unbound restart handlers run
- name: Configure DNS resolution, DHCP on head node
  hosts: head
  become: yes
  roles:
    - dns-configure
    - dhcpd

- name: Install apt-cacher-ng
  become: yes
  hosts: head
  roles:
    - apt-cacher-ng

- name: Install docker registry, elasticstack, and apache proxy
  become: yes
  hosts: head
  roles:
    - java-oracle
    - elasticstack
    - apache-proxy

