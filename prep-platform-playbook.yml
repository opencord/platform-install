---
# cord-prep-platform.yml
# Prepares the CORD head node for installing OpenStack, ONOS, and XOS

- name: Include vars
  hosts: all
  tasks:
    - name: Include variables
      include_vars: "{{ item }}"
      with_items:
        - "profile_manifests/{{ cord_profile }}.yml"
        - profile_manifests/local_vars.yml

- name: Head node prep
  hosts: head
  roles:
    - { role: head-prep, become: yes }

- name: Configure management network on all nodes
  hosts: all
  become: yes
  roles:
    - { role: interface-config, when: not on_maas }

- name: Head node setup, mgmtbr, DNS servers, apt-cacher-ng
  hosts: head
  become: yes
  roles:
    - { role: head-mgmtbr, when: not on_maas }
    - { role: dns-unbound, when: not on_maas }
    - { role: dns-nsd, when: not on_maas }
    - apt-cacher-ng

- name: Configure DNS lookups on all nodes, prep
  hosts: all
  become: yes
  roles:
    - { role: dns-configure, when: not on_maas }
    - common-prep

