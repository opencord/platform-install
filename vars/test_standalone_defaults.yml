---
# test-standalone_defaults.yml

cord_profile: test-standalone

xos_admin_user: xosadmin@opencord.org
xos_admin_pass: "{{ lookup('password', 'credentials/xosadmin@opencord.org chars=ascii_letters,digits') }}"
xos_admin_first: XOS
xos_admin_last: Admin

xos_users: []

xos_bootstrap_ui_port: 9998
xos_ui_port: 9999

xos_docker_volumes:
  - "../orchestration/xos/xos/core/tests:/opt/xos/core/tests:ro"

xos_redis: False

xos_tosca_templates:
  - deployment.yaml

xos_libraries:
  - "ng-xos-lib"

# paths defined in manifest/default.xml
xos_services:
  - name: volt
    path: onos-apps/apps/olt
  - name: onos
    path: orchestration/xos_services/onos-service
  - name: vrouter
    path: orchestration/xos_services/vrouter
  - name: vsg
    path: orchestration/xos_services/vsg
  - name: vtr
    path: orchestration/xos_services/vtr


xos_service_sshkeys:
  - name: onos_rsa
    source_path: "/dev/null"
  - name: onos_rsa.pub
    source_path: "/dev/null"
  - name: volt_rsa
    source_path: "/dev/null"
  - name: volt_rsa.pub
    source_path: "/dev/null"
  - name: vsg_rsa
    source_path: "/dev/null"
  - name: vsg_rsa.pub
    source_path: "/dev/null"

