---
# opencloud-prep-playboook.yml
# Prep buildhost to create OpenCloud site

- name: ping all hosts to get network interface info using setup
  hosts: all
  tasks:
    - name: ping all hosts
      ping:

- name: Include vars
  hosts: all
  tasks:
    - name: Include variables
      include_vars: "{{ item }}"
      with_items:
        - "profile_manifests/{{ cord_profile }}.yml"
        - profile_manifests/local_vars.yml

- include: pki-setup-playbook.yml

- name: Configure buildhost docker credentials
  hosts: localhost
  connection: local
  roles:
    - docker-buildhost-conf

