---
# onboard-vtr-playbook.yml
# 
# Intended for ONS 2017 Demo (require mock-rcord/rcord profile to be there)

- name: Include vars
  hosts: all
  tasks:
    - name: Include variables
      include_vars: "{{ item }}"
      with_items:
        - "profile_manifests/{{ cord_profile }}.yml"
        - profile_manifests/local_vars.yml

- name: Load VTR TOSCA in XOS
  hosts: all
  tasks:
    - name: Include VTR TOSCA in available recipes
      copy: 
        src: roles/xos-vtr-onboard/files/vtr-tosca.yaml
        dest: {{ cord_profile }}

- include: add-onboard-containers-playbook.yml

- name: Execute VTR TOSCA in XOS
  hosts: xos_ui
  connection: docker
  tasks:
    - name: Remove the VTR Service model
      command: "python /opt/xos/tosca/destroy.py {{ xos_admin_user }} /opt/cord_profile/vtr-tosca.yaml"
      tags:
        - skip_ansible_lint # TOSCA loading should be idempotent

- name: Execute VTR GUI TOSCA in XOS
  hosts: xos_ui
  connection: docker
  tasks:
    - name: Remove the VTR GUI
      command: "python /opt/xos/tosca/destroy.py {{ xos_admin_user }} /opt/cord_profile/xos-gui-extensions-onboard.yml"
      tags:
        - skip_ansible_lint # TOSCA loading should be idempotent