---
# xos-api-tests-playbook.yml

- name: Include vars
  hosts: all
  tasks:
    - name: Include variables
      include_vars: "{{ item }}"
      with_items:
        - "profile_manifests/{{ cord_profile }}.yml"
        - profile_manifests/local_vars.yml

- name: Execute api tests on chameleon
  hosts: head
  roles:
   - xos-rest-api-test

- include: xos-container-test.yml
