---
# opencloud-multi-playbook.yml
# Install an OpenCloud site, with multi-node Juju configured OpenStack

- name: Include vars
  hosts: all
  tasks:
    - name: Include variables
      include_vars: "{{ item }}"
      with_items:
        - "profile_manifests/{{ cord_profile }}.yml"
        - profile_manifests/local_vars.yml

- name: Turn on virtualization
  hosts: all
  become: yes
  roles:
   - { role: dell-virt, when: not virtual_install }

- include: prep-platform-playbook.yml
- include: pki-setup-playbook.yml
- include: ssh-setup-playbook.yml

- name: Install ElasticStack and Apache
  hosts: head
  become: yes
  roles:
    - java-oracle
    - elasticstack
    - apache-proxy

- name: Configure head node, create containers
  hosts: head
  roles:
    - { role: head-prep, become: yes }

- name: Setup DHCP, Create LXD containers
  hosts: head
  become: yes
  roles:
    - dhcpd
    - create-lxd-opencloud

- name: Test LXD containers
  hosts: head
  roles:
    - lxd-tests

- name: Install OpenStack with Juju
  hosts: head
  roles:
    - juju-setup

- name: Run xos deploy directly on head node
  hosts: head
  tasks:
    - name: Deploy XOS
      command: >
        ansible-playbook 
          -i inventory/head-localhost 
          --extra-vars "cord_profile={{ cord_profile }}"
          deploy-xos-playbook.yml 
      args:
        chdir: "{{ cord_dir }}/build/platform-install"

- include: deploy-xos-playbook.yml

- name: Finish OpenStack install
  hosts: head
  roles:
    - juju-finish

- include: cord-compute-playbook.yml

