---
# opencloud-multi-playbook.yml
# Install an OpenCloud site, with multi-node Juju configured OpenStack

- name: Include vars
  hosts: all
  tasks:
    - name: Include variables
      include_vars: "{{ item }}"
      with_items:
        - "profile_manifests/{{ cord_profile }}.yml"
        - profile_manifests/local_vars.yml

- name: Install ElasticStack, Apache proxy, DHCP server
  hosts: head
  become: yes
  roles:
    - docker-registry
    - java-oracle
    - elasticstack
    - apache-proxy
    - dhcpd

- name: Create LXD containers
  hosts: head
  become: yes
  roles:
    - create-lxd-opencloud

- name: Test LXD containers
  hosts: head
  roles:
    - lxd-tests

- name: Install OpenStack with Juju
  hosts: head
  roles:
    - juju-setup

- name: Deploy and start ONOS containers
  hosts: head
  roles:
    - onos-cord-install

- include: deploy-xos-playbook.yml

- name: Finish OpenStack install
  hosts: head
  roles:
    - juju-finish

- name: Configure compute nodes
  hosts: compute
  become: yes
  roles:
    - compute-prep

- name: Deploy compute nodes, create configuration
  hosts: head
  roles:
    - juju-compute-setup
    - compute-node-config

- name: Enable compute nodes in XOS
  hosts: xos_ui
  connection: docker
  roles:
    - compute-node-enable

