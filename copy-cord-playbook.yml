---
# copy-cord-playbook.yml
# Copy the cord directory to the build node

- name: Include vars
  hosts: build, localhost
  tasks:
    - name: Include variables
      include_vars: "{{ item }}"
      with_items:
        - "profile_manifests/{{ cord_profile }}.yml"
        - profile_manifests/local_vars.yml

- name: Fix docker image build contexts
  hosts: localhost
  connection: local
  roles:
    - build-context-fixup

- name: Copy cord directory structure to build node
  hosts: build
  become: yes
  roles:
    - copy-cord

