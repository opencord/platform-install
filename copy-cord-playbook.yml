---
# copy-cord-playbook.yml
# Copy the cord directory to the head node

- name: Include vars
  hosts: head
  tasks:
    - name: Include variables
      include_vars: "{{ item }}"
      with_items:
        - "profile_manifests/{{ cord_profile }}.yml"
        - profile_manifests/local_vars.yml

- name: Copy cord directory structure to head node
  hosts: head
  become: yes
  roles:
    - copy-cord

