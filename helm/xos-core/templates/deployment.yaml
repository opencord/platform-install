apiVersion: extensions/v1beta1
kind: Deployment
metadata:
  name: {{ template "xos-core.full_name" . }}
  labels:
    app: xos-db    
spec:
  replicas: 1
  template:
    metadata:
      labels:
        app: xos-db    
      annotations:
        checksum/config-map: {{ include (print $.Chart.Name "/templates/config-map.yaml") . | sha256sum }}
    spec:
      containers:
        - name: xos-db 
          image: {{ .Values.image.xos_db }}:{{ .Values.image.xos_tag }}
          ports:
            - containerPort: 5432 
              protocol: TCP
          env:
            - name: SERVICE_5432_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ template "xos-core.full_name" . }}
                  key: service_5432_name
