---
# test-standalone-playbook.yaml

- name: Include vars
  hosts: all
  tasks:
    - name: Include variables
      include_vars: "{{ item }}"
      with_items:
        - "vars/{{ cord_profile }}_defaults.yml"
        - vars/local_vars.yaml

- include:  cord-bootstrap-playbook.yaml

- name: Create CORD profile, create docker images, bootstrap XOS in docker
  hosts: head
  roles:
    - cord-profile
    - xos-base-image
    - xos-image
    - xos-test-image
    - xos-bootstrap

- name: Re-include vars after adding docker containers
  hosts: xos_bootstrap_ui
  tasks:
    - name: Include variables
      include_vars: "{{ item }}"
      with_items:
        - "vars/{{ cord_profile }}_defaults.yml"
        - vars/local_vars.yaml

- name: Onboard XOS services
  hosts: xos_bootstrap_ui
  connection: docker
  roles:
    - xos-onboarding

- name: Add onboarded containers to inventory
  hosts: head
  roles:
    - xos-onboard-hosts

- name: Re-include vars after adding docker containers
  hosts: xos_ui
  tasks:
    - name: Include variables
      include_vars: "{{ item }}"
      with_items:
        - "vars/{{ cord_profile }}_defaults.yml"
        - vars/local_vars.yaml

- name: Check to see if XOS UI is ready
  hosts: xos_ui
  connection: docker
  roles:
    - xos-ready
    - api-test-prep

- name: Clear the XOS database
  hosts: xos_db
  connection: docker
  roles:
    - xos-clear-db

- name: Run API tests
  hosts: xos_ui
  connection: docker
  roles:
    - xos-test-restore-db
    - api-tests

- name: Clear the XOS database (again)
  hosts: xos_db
  connection: docker
  roles:
    - xos-clear-db

- name: Run TOSCA tests
  hosts: xos_ui
  connection: docker
  roles:
    - xos-test-restore-db
    - tosca-tests

